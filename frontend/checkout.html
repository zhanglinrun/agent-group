<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电商 AI 导购结算页</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="checkout">
  <div class="consumer-shell checkout-shell">
    <header class="consumer-topbar">
      <a class="brand-line" href="./index.html" aria-label="返回电商 AI 导购用户端">
        <span class="brand-mark">AG</span>
        <span>
          <strong>订单结算</strong>
          <small>确认商品 · 创建订单 · 模拟支付</small>
        </span>
      </a>

      <nav class="top-links" aria-label="页面入口">
        <a href="./index.html">返回导购</a>
        <a href="./admin.html">运营端</a>
      </nav>
    </header>

    <main class="checkout-main">
      <section class="checkout-panel checkout-product-panel" aria-label="商品确认">
        <div class="checkout-mode-row">
          <span id="checkoutMode" class="state-badge">拼团购买</span>
          <span id="checkoutStatus" class="tag warn">待提交</span>
        </div>

        <div class="checkout-product">
          <div class="checkout-art" aria-hidden="true"><div class="tablet-shape"></div></div>
          <div>
            <p class="eyebrow">商品确认</p>
            <h1 id="checkoutTitle">轻薄学习平板标准版</h1>
            <p id="checkoutSpec" class="checkout-copy">10.9 英寸屏幕，128GB 存储，支持手写笔</p>
          </div>
        </div>

        <div class="checkout-price-row">
          <strong id="checkoutPrice">￥2099</strong>
          <div>
            <span id="checkoutOrigin">原价 ￥2399</span>
            <span id="checkoutGroup">拼团价 ￥2099</span>
          </div>
        </div>

        <div class="checkout-info-grid">
          <div>
            <span>拼团规则</span>
            <strong id="checkoutTeam">3 人成团 · 29 分钟</strong>
          </div>
          <div>
            <span>售后政策</span>
            <strong id="checkoutAfterSale">7 天无理由退货，1 年质保</strong>
          </div>
        </div>

        <div class="checkout-actions">
          <button id="confirmOrderBtn" class="primary-button" type="button">确认下单</button>
          <button id="mockPayBtn" class="soft-button" type="button" disabled>模拟支付</button>
          <button id="refreshFlowBtn" class="soft-button" type="button" disabled>刷新流水</button>
        </div>
      </section>

      <section class="checkout-panel" aria-label="订单结果">
        <div class="block-title">
          <div>
            <strong>订单状态</strong>
            <span>后端返回的订单、支付和拼团状态</span>
          </div>
        </div>

        <dl class="checkout-detail-list">
          <div>
            <dt>订单号</dt>
            <dd id="checkoutOrderId">-</dd>
          </div>
          <div>
            <dt>支付单号</dt>
            <dd id="checkoutPayOrderId">-</dd>
          </div>
          <div>
            <dt>支付地址</dt>
            <dd id="checkoutPayUrl">-</dd>
          </div>
          <div>
            <dt>订单状态</dt>
            <dd id="checkoutOrderStatus">-</dd>
          </div>
          <div>
            <dt>支付状态</dt>
            <dd id="checkoutPayStatus">-</dd>
          </div>
          <div>
            <dt>拼团队伍</dt>
            <dd id="checkoutTeamId">-</dd>
          </div>
        </dl>
      </section>

      <section class="checkout-panel checkout-flow-panel" aria-label="交易流水">
        <div class="block-title">
          <div>
            <strong>交易流水</strong>
            <span>下单、支付和状态推进过程</span>
          </div>
        </div>
        <ol id="checkoutTimeline" class="timeline wide"></ol>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
