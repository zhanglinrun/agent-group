server:
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: ${AGENT_GROUP_TOMCAT_MAX_CONNECTIONS:20}
    threads:
      max: ${AGENT_GROUP_TOMCAT_THREADS_MAX:20}
      min-spare: ${AGENT_GROUP_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${AGENT_GROUP_TOMCAT_ACCEPT_COUNT:10}

spring:
  mvc:
    async:
      request-timeout: 60000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGENT_GROUP_MYSQL_URL:jdbc:mysql://127.0.0.1:13306/agent_group?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AGENT_GROUP_MYSQL_USERNAME:root}
    password: ${AGENT_GROUP_MYSQL_PASSWORD:agent_group_dev}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AgentGroup_HikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${AGENT_GROUP_REDIS_HOST:127.0.0.1}
      port: ${AGENT_GROUP_REDIS_PORT:16379}
      database: ${AGENT_GROUP_REDIS_DATABASE:0}
      password: ${AGENT_GROUP_REDIS_PASSWORD:}
      timeout: 5s
  rabbitmq:
    host: ${AGENT_GROUP_RABBITMQ_HOST:127.0.0.1}
    port: ${AGENT_GROUP_RABBITMQ_PORT:5672}
    username: ${AGENT_GROUP_RABBITMQ_USERNAME:agent_group}
    password: ${AGENT_GROUP_RABBITMQ_PASSWORD:agent_group_dev}
    listener:
      simple:
        prefetch: ${AGENT_GROUP_RABBITMQ_LISTENER_PREFETCH:1}
        default-requeue-rejected: ${AGENT_GROUP_RABBITMQ_LISTENER_DEFAULT_REQUEUE_REJECTED:false}
        retry:
          enabled: ${AGENT_GROUP_RABBITMQ_LISTENER_RETRY_ENABLED:true}
          max-attempts: ${AGENT_GROUP_RABBITMQ_LISTENER_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${AGENT_GROUP_RABBITMQ_LISTENER_RETRY_INITIAL_INTERVAL:1000ms}
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    root: info
    com.linrun: debug

thread:
  pool:
    executor:
      config:
        core-pool-size: ${AGENT_GROUP_THREAD_CORE_POOL_SIZE:20}
        max-pool-size: ${AGENT_GROUP_THREAD_MAX_POOL_SIZE:50}
        keep-alive-time: ${AGENT_GROUP_THREAD_KEEP_ALIVE_TIME:5000}
        block-queue-size: ${AGENT_GROUP_THREAD_BLOCK_QUEUE_SIZE:5000}
        policy: ${AGENT_GROUP_THREAD_REJECT_POLICY:CallerRunsPolicy}

agent:
  group:
    stream:
      timeout-millis: 60000
      mock-delay-millis: 350
    spring-ai:
      enabled: ${AGENT_GROUP_SPRING_AI_ENABLED:true}
      vector-store-enabled: ${AGENT_GROUP_SPRING_AI_VECTOR_STORE_ENABLED:true}
    rabbit:
      enabled: ${AGENT_GROUP_RABBIT_ENABLED:true}
    redis:
      key-prefix: ${AGENT_GROUP_REDIS_KEY_PREFIX:agent-group}
    vector:
      host: ${AGENT_GROUP_PGVECTOR_HOST:127.0.0.1}
      port: ${AGENT_GROUP_PGVECTOR_PORT:15432}
      database: ${AGENT_GROUP_PGVECTOR_DATABASE:agent_group_vector}
      username: ${AGENT_GROUP_PGVECTOR_USERNAME:agent_group}
      password: ${AGENT_GROUP_PGVECTOR_PASSWORD:agent_group_dev}
      dimension: 1024
      local-fallback-enabled: ${AGENT_GROUP_VECTOR_LOCAL_FALLBACK_ENABLED:true}
      keyword-fallback-enabled: ${AGENT_GROUP_VECTOR_KEYWORD_FALLBACK_ENABLED:true}
    minio:
      endpoint: ${AGENT_GROUP_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${AGENT_GROUP_MINIO_ACCESS_KEY:agent_group}
      secret-key: ${AGENT_GROUP_MINIO_SECRET_KEY:agent_group_dev}
      bucket-name: ${AGENT_GROUP_MINIO_BUCKET:agent-group}
    llm:
      base-url: ${AGENT_GROUP_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${AGENT_GROUP_LLM_API_KEY:${DASHSCOPE_API_KEY:}}
      chat-model: ${AGENT_GROUP_LLM_CHAT_MODEL:qwen3.6-plus}
      embedding-model: ${AGENT_GROUP_LLM_EMBEDDING_MODEL:text-embedding-v3}
      vision-model: ${AGENT_GROUP_LLM_VISION_MODEL:qwen3-vl-plus}
      timeout-seconds: ${AGENT_GROUP_LLM_TIMEOUT_SECONDS:20}
      max-retries: ${AGENT_GROUP_LLM_MAX_RETRIES:2}
      min-interval-millis: ${AGENT_GROUP_LLM_MIN_INTERVAL_MILLIS:200}
      prompt-token-price-yuan-per-1k: ${AGENT_GROUP_LLM_PROMPT_TOKEN_PRICE_YUAN_PER_1K:0}
      completion-token-price-yuan-per-1k: ${AGENT_GROUP_LLM_COMPLETION_TOKEN_PRICE_YUAN_PER_1K:0}
    multimodal:
      image:
        max-file-size-bytes: ${AGENT_GROUP_MULTIMODAL_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
        allowed-content-types: ${AGENT_GROUP_MULTIMODAL_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/gif}
    upload:
      allowed-extensions: ${AGENT_GROUP_UPLOAD_ALLOWED_EXTENSIONS:md,txt,pdf,docx}
      max-file-size-bytes: ${AGENT_GROUP_UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
    security:
      admin-username: ${AGENT_GROUP_ADMIN_USERNAME:admin}
      admin-password: ${AGENT_GROUP_ADMIN_PASSWORD:admin_dev}
      operator-username: ${AGENT_GROUP_OPERATOR_USERNAME:operator}
      operator-password: ${AGENT_GROUP_OPERATOR_PASSWORD:operator_dev}
    evaluate:
      case-file: ${AGENT_GROUP_EVALUATE_CASE_FILE:}
    payment:
      webhook:
        replay-window-seconds: ${AGENT_GROUP_PAYMENT_WEBHOOK_REPLAY_WINDOW_SECONDS:300}
      alipay:
        gateway-url: ${AGENT_GROUP_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
        app-id: ${AGENT_GROUP_ALIPAY_APP_ID:}
        private-key: ${AGENT_GROUP_ALIPAY_PRIVATE_KEY:}
        public-key: ${AGENT_GROUP_ALIPAY_PUBLIC_KEY:}
        charset: ${AGENT_GROUP_ALIPAY_CHARSET:UTF-8}
        sign-type: ${AGENT_GROUP_ALIPAY_SIGN_TYPE:RSA2}
      wechat:
        app-id: ${AGENT_GROUP_WECHAT_APP_ID:}
        merchant-id: ${AGENT_GROUP_WECHAT_MERCHANT_ID:}
        private-key-path: ${AGENT_GROUP_WECHAT_PRIVATE_KEY_PATH:}
        merchant-serial-no: ${AGENT_GROUP_WECHAT_MERCHANT_SERIAL_NO:}
        api-v3-key: ${AGENT_GROUP_WECHAT_API_V3_KEY:}

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: agent-group
